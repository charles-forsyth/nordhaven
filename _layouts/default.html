<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c121b" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('nh.mode');
          if (m === 'parchment') document.documentElement.setAttribute('data-mode', 'parchment');
        } catch (e) {}
      })();
    </script>
    {% seo %}
    {% feed_meta %}
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+Runic&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="{{ '/assets/css/nordhaven.css' | relative_url }}" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230c121b'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='%23d0913e' font-family='serif'%3E%E1%9B%9F%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the text</a>
    {% include header.html %}
    <main id="main">{{ content }}</main>
    {% include footer.html %}
    {% include search.html %}
    <script>
      window.NH = { base: '{{ site.baseurl }}' };
    </script>
    <script src="{{ '/assets/js/nordhaven.js' | relative_url }}" defer></script>
  </body>
</html>
