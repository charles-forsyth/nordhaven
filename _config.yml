title: Nordhaven
description: Tales told from the Great Nordhaven Lodge
tagline: "Norse earth-faith, living soil, ridge telemetry and honest engineering, from a high-ridge homestead."
url: https://charles-forsyth.github.io
baseurl: /nordhaven
lang: en_US
timezone: Etc/UTC
author: Nordhaven
permalink: /:year/:month/:day/:title.html

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  manual:
    output: true
    permalink: /manual/:name/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: manual
    values:
      layout: manual
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - docs
