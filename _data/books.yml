# Nordhaven Press catalog. Covers are drawn in CSS from c1/c2 and the rune.
- slug: web-of-wyrd
  title: "The Web of Wyrd and Entropy"
  subtitle: "Ancient Norse Cosmology, Thermodynamics, and the Science of the Living Homestead"
  series: "Metaphysics and Physics"
  rune: "ᛈ"
  c1: "#24304f"
  c2: "#0d1222"
  chapters: 12
  premise: "The Norse web of Wyrd, the woven chain of cause, consequence and ancestral momentum, read as an intuitive model of entropy and ecological feedback. On a working homestead, soil respiration, heat loss, nutrient loops and generational fertility become both a duty to the Norns and an exercise in non-equilibrium thermodynamics."
